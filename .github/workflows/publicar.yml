name: Atualizar e publicar o site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"     # publicações e notícias: toda segunda, 06h17 (Brasília)
    - cron: "41 */3 * * *"   # agenda Google: a cada 3 horas
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manter a área de membros ativa (Supabase gratuito)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          c = json.load(open("data/membros.json"))
          u, k = c.get("supabase_url", ""), c.get("supabase_anon_key", "")
          if u.startswith("https://") and k:
              req = urllib.request.Request(u.rstrip("/") + "/rest/v1/rpc/ping", data=b"{}", method="POST",
                    headers={"apikey": k, "Content-Type": "application/json"})
              try:
                  print("ping:", urllib.request.urlopen(req, timeout=30).read()[:40])
              except Exception as e:
                  print("ping falhou:", e)
          else:
              print("área de membros ainda não configurada")
          PY

      - name: Buscar compromissos da Agenda Google
        run: python3 scripts/agenda.py

      - name: Buscar publicações (OpenAlex) e notícias
        if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1'
        env:
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
        run: python3 scripts/atualizar.py

      - name: Salvar dados atualizados no repositório
        run: |
          git config user.name "unseel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualização automática (agenda, publicações e mídia)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
